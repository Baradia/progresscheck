<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger PPL</title>
<meta name="theme-color" content="#22262E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#22262E; --panel:#2C313A; --panel2:#353B45; --line:#414854;
  --ink:#F1ECE2; --ink2:#A9B0BA; --ink3:#6F7784;
  --blue:#3F7DFF; --blue2:#8FB3FF;
  --green:#3EBB72; --yellow:#E6C64B; --red:#E24A3F;
  --head:"Roboto Condensed","Arial Narrow",Roboto,system-ui,sans-serif;
  --body:Roboto,"Segoe UI",system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px}
h3{font-size:19px;color:var(--ink2);font-weight:500}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.app{display:flex;height:100%;padding-top:env(safe-area-inset-top)}
nav.rail{width:88px;flex:none;background:var(--panel);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:6px;border-right:1px solid var(--line)}
nav.rail .brand{font-family:var(--head);font-size:22px;font-weight:700;text-align:center;padding:8px 0 10px;color:var(--blue2)}
nav.rail .sync{margin-top:auto;font-size:12px;color:var(--ink3);text-align:center;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.rail .sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:block}
nav.rail .sync.ok i{background:var(--green)} nav.rail .sync.busy i{background:var(--yellow)} nav.rail .sync.err i{background:var(--red)}
.auth{max-width:520px;margin:0 auto;padding:40px 24px}
.auth input[type=password],.auth input[type=text]{width:100%;text-align:left;font-family:var(--body);font-size:16px}
.msg{background:var(--panel2);border-radius:var(--r);padding:10px 14px;font-size:14px;margin:10px 0}
nav.rail button{background:none;border:0;border-radius:var(--r);padding:12px 4px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer}
nav.rail button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.rail button.on{background:var(--panel2);color:var(--ink)}
nav.rail button:focus-visible{outline:2px solid var(--blue)}
main{flex:1;display:flex;min-width:0}
.pane{overflow:auto;padding:22px 24px 40px}
.pane.body{width:clamp(300px,32vw,420px);flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding-bottom:16px}
.pane.content{flex:1}
.figure{width:100%;display:block;flex:1;min-height:0;max-height:560px;margin:auto 0}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;background:var(--panel2);color:var(--ink2)}
.pill.blue{background:var(--blue);color:#fff}
.pill.green{background:var(--green);color:#0f2a19}
.pill.red{background:var(--red);color:#fff}
.card{background:var(--panel);border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--line)}
.card.hl{border-color:var(--blue)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;cursor:pointer;font-family:var(--head);font-size:18px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{padding:8px 12px;font-size:15px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue2)}
input[type=number],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:110px;font-family:var(--head);font-size:22px;text-align:center}
input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;color:var(--ink2);font-size:14px;margin-bottom:6px}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px 14px;align-items:center;margin-top:10px}
.sets .h{font-size:13px;color:var(--ink3)}
.stepper{display:inline-flex;justify-self:start;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepper button{background:var(--panel2);border:0;width:44px;height:48px;font-size:24px;cursor:pointer}
.stepper input{border:0;border-radius:0;width:96px;height:48px}
.done{color:var(--green)}
.warm{color:var(--yellow)}
.sets .stepper.mini input{width:82px;font-size:18px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit;color:inherit;min-height:80px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--blue)}
.xbtn{background:none;border:0;color:var(--ink3);font-size:20px;cursor:pointer;padding:4px 8px}
.xbtn:hover{color:var(--red)}
.cal .d{cursor:pointer}
.timer{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;border-radius:14px;padding:10px 18px;margin-bottom:14px;display:none;align-items:center;justify-content:space-between}
.timer.on{display:flex}
.timer .t{font-family:var(--head);font-size:34px;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:6px;background:#3a2f0f;color:var(--yellow);border-radius:99px;padding:4px 10px;font-size:13px}
.chart{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:16px;color:var(--ink3);position:relative}
.cal .d.today{outline:2px solid var(--blue2)}
.cal .d.push{background:#3d5f8f;color:#fff}.cal .d.pull{background:#3f7a63;color:#fff}.cal .d.legs{background:#8a5637;color:#fff}.cal .d.cal{background:#6b5aa8;color:#fff}
.cal .d small{position:absolute;top:3px;left:5px;font-size:10px;font-family:var(--body)}
.exlist button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.exlist button.on{border-color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-family:var(--head);font-size:18px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.setup{max-width:520px;margin:0 auto;padding:40px 24px}
.hidden{display:none!important}
.mus{cursor:pointer;stroke:var(--bg);stroke-width:1.5;transition:fill .25s}
.mus:hover{stroke:var(--ink)}
.mus.sel{stroke:var(--ink);stroke-width:2.5}
.sil{fill:#3A404A}
.figlabel{font-family:var(--head);font-size:12px;fill:var(--ink3)}
.stat{font-family:var(--head);font-size:30px;line-height:1}
.stat small{font-size:14px;color:var(--ink2);font-family:var(--body);display:block;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:980px){
  .app{flex-direction:column-reverse}
  nav.rail{width:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.rail .brand,nav.rail .sync{display:none}
  nav.rail button{padding:8px 6px;flex:1}
  main{flex-direction:column;overflow:auto}
  .pane.body{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:46vh;padding:14px 16px}
  .pane{padding:16px 14px 40px}
  h1{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .pane{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* ============ DATA ============ */
const MUSCLES = {
  chest:'Chest', front_delts:'Front delts', side_delts:'Side delts', rear_delts:'Rear delts',
  biceps:'Biceps', triceps:'Triceps', forearms:'Forearms', traps:'Traps', lats:'Lats',
  lower_back:'Lower back', abs:'Abs', quads:'Quads', hamstrings:'Hamstrings', glutes:'Glutes', calves:'Calves'
};
const DAYS = ['push','pull','legs'];
const DAY_NAME = {push:'Push', pull:'Pull', legs:'Legs'};

/* load: bar = total bar weight, db = weight of ONE dumbbell, bw = added weight on top of bodyweight (negative = assisted), machine = stack/plates.
   std = male 1RM-to-bodyweight ratios [beginner, novice, intermediate, advanced, elite].
   Compiled from published strength-standard tables (StrengthLevel / Symmetric Strength style ratios for 18-39 male, ~70 kg). Approximate. */
const EX = [
 {id:'ohp',      day:'push', name:'Overhead press',          sets:5, reps:5, load:'bar',     inc:{kg:2.5, lb:5},   primary:['front_delts','side_delts'], secondary:['triceps','abs'],            std:[0.45,0.65,0.95,1.30,1.65]},
 {id:'dbbench',  day:'push', name:'Dumbbell bench press',     sets:3, reps:5, load:'db',      inc:{kg:2.5, lb:5},   primary:['chest'],                    secondary:['front_delts','triceps'],   std:[0.17,0.29,0.43,0.60,0.80]},
 {id:'dips',     day:'push', name:'Dips',                     sets:3, reps:8, load:'bw',      inc:{kg:2.5, lb:5},   primary:['chest','triceps'],          secondary:['front_delts','abs'],       std:[0.85,1.15,1.50,1.90,2.30]},
 {id:'latraise', day:'push', name:'Lateral raise',            sets:3, reps:8, load:'db',      inc:{kg:1, lb:2.5},   primary:['side_delts'],               secondary:['traps'],                   std:[0.07,0.12,0.19,0.28,0.38]},
 {id:'lyingext', day:'push', name:'Lying dumbbell extension', sets:3, reps:8, load:'db',      inc:{kg:1, lb:2.5},   primary:['triceps'],                  secondary:[],                          std:[0.10,0.17,0.26,0.37,0.50]},
 {id:'pushdown', day:'push', name:'Tricep pushdown',          sets:3, reps:8, load:'machine', inc:{kg:2.5, lb:5},   primary:['triceps'],                  secondary:[],                          std:[0.30,0.50,0.75,1.05,1.40]},

 {id:'pullup',   day:'pull', name:'Pull-up',                  sets:5, reps:5, load:'bw',      inc:{kg:2.5, lb:5},   primary:['lats'],                     secondary:['biceps','rear_delts','forearms'], std:[0.80,1.10,1.45,1.85,2.25], alt:'pulldown'},
 {id:'pulldown', day:'pull', name:'Lat pulldown',             sets:5, reps:5, load:'machine', inc:{kg:2.5, lb:5},   primary:['lats'],                     secondary:['biceps','rear_delts'],     std:[0.55,0.85,1.20,1.60,2.00], alt:'pullup'},
 {id:'bbrow',    day:'pull', name:'Bent-over barbell row',    sets:3, reps:5, load:'bar',     inc:{kg:2.5, lb:5},   primary:['lats','traps'],             secondary:['biceps','rear_delts','lower_back'], std:[0.50,0.80,1.15,1.55,1.95]},
 {id:'tbar',     day:'pull', name:'T-bar row',                sets:3, reps:8, load:'machine', inc:{kg:2.5, lb:5},   primary:['lats'],                     secondary:['traps','biceps','rear_delts'], std:[0.55,0.85,1.20,1.60,2.05]},
 {id:'shrug',    day:'pull', name:'Dumbbell shrug',           sets:3, reps:8, load:'db',      inc:{kg:2.5, lb:5},   primary:['traps'],                    secondary:['forearms'],                std:[0.30,0.50,0.75,1.05,1.40]},
 {id:'preacher', day:'pull', name:'Preacher curl',            sets:3, reps:8, load:'bar',     inc:{kg:1, lb:2.5},   primary:['biceps'],                   secondary:['forearms'],                std:[0.25,0.40,0.60,0.85,1.10]},
 {id:'hammer',   day:'pull', name:'Hammer curl',              sets:3, reps:8, load:'db',      inc:{kg:1, lb:2.5},   primary:['biceps','forearms'],        secondary:[],                          std:[0.12,0.20,0.30,0.42,0.55]},

 {id:'squat',    day:'legs', name:'Barbell squat',            sets:5, reps:5, load:'bar',     inc:{kg:5, lb:10},    primary:['quads','glutes'],           secondary:['hamstrings','lower_back','abs'], std:[0.75,1.25,1.70,2.15,2.60]},
 {id:'deadlift', day:'legs', name:'Deadlift',                 sets:3, reps:5, load:'bar',     inc:{kg:5, lb:10},    primary:['hamstrings','glutes','lower_back'], secondary:['quads','traps','forearms'], std:[0.95,1.45,1.95,2.50,3.05]},
 {id:'legpress', day:'legs', name:'Leg press',                sets:3, reps:8, load:'machine', inc:{kg:5, lb:10},    primary:['quads','glutes'],           secondary:['hamstrings'],              std:[1.20,1.90,2.70,3.60,4.50]},
 {id:'legcurl',  day:'legs', name:'Lying leg curl',           sets:3, reps:8, load:'machine', inc:{kg:2.5, lb:5},   primary:['hamstrings'],               secondary:['calves'],                  std:[0.35,0.60,0.90,1.25,1.65]},
 {id:'legext',   day:'legs', name:'Leg extension',            sets:3, reps:8, load:'machine', inc:{kg:2.5, lb:5},   primary:['quads'],                    secondary:[],                          std:[0.45,0.75,1.15,1.60,2.10]},
 {id:'calf',     day:'legs', name:'Seated calf raise',        sets:3, reps:8, load:'machine', inc:{kg:2.5, lb:5},   primary:['calves'],                   secondary:[],                          std:[0.40,0.70,1.05,1.45,1.90]},
];
const LEVELS = ['Beginner','Novice','Intermediate','Advanced','Elite'];
// Age multiplier applied to standards (strength peaks roughly 20-35).
function ageFactor(a){ if(a<18) return .88; if(a<=35) return 1; if(a<=45) return .95; if(a<=55) return .88; if(a<=65) return .80; return .70; }

/* ============ STORAGE ============ */
const KEY='ledger-ppl-v1', TKEY='ledger-ppl-token';
let mem=null, memTok=null;
const store={
  load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):mem; }catch(e){ return mem; } },
  save(d){ mem=d; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} },
  token(){ try{ return localStorage.getItem(TKEY)||memTok; }catch(e){ return memTok; } },
  setToken(t){ memTok=t; try{ t?localStorage.setItem(TKEY,t):localStorage.removeItem(TKEY); }catch(e){} }
};
let S = store.load() || null;
function blank(){ return {profile:null, bw:[], sessions:[], settings:{rest:120}, updatedAt:0}; }
function save(){ S.updatedAt=Date.now(); store.save(S); schedulePush(); }

/* ============ GITHUB GIST SYNC ============ */
const GIST_FILE='ledger-ppl.json', GIST_DESC='Ledger PPL workout data (do not edit by hand)';
const sync={state:'off', user:null, gistId:null, msg:'', timer:null, pushing:false, dirty:false};
function setSync(state,msg=''){ sync.state=state; sync.msg=msg; const el=document.querySelector('nav .sync'); if(el){ el.className='sync '+({ok:'ok',busy:'busy',err:'err',off:''}[state]||''); el.querySelector('span').textContent={ok:'Synced',busy:'Syncing',err:'Sync error',off:'Local only'}[state]; el.title=msg; } }
async function gh(path,method='GET',body){
  const r=await fetch('https://api.github.com'+path,{method,headers:{Authorization:'Bearer '+store.token(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401){ throw new Error('Token was rejected. Sign in again with a token that has the Gists permission.'); }
  if(!r.ok){ throw new Error('GitHub '+r.status+': '+(await r.text()).slice(0,120)); }
  return r.status===204?null:r.json();
}
async function findGist(){
  if(sync.gistId) return sync.gistId;
  for(let page=1;page<=5;page++){ const list=await gh('/gists?per_page=100&page='+page); const g=list.find(x=>x.files && x.files[GIST_FILE]); if(g){ sync.gistId=g.id; return g.id; } if(list.length<100) break; }
  return null;
}
async function readGist(id){
  const g=await gh('/gists/'+id); const f=g.files[GIST_FILE]; if(!f) return null;
  let txt=f.content; if(f.truncated){ txt=await (await fetch(f.raw_url)).text(); }
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
function merge(a,b){ // union of two ledgers; newer wins on scalar conflicts
  if(!a) return b; if(!b) return a;
  const [n,o]= (a.updatedAt||0)>=(b.updatedAt||0)?[a,b]:[b,a];
  const out=blank(); out.profile=n.profile||o.profile; out.settings={...o.settings,...n.settings}; out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  const sess={}; for(const x of [...o.sessions,...n.sessions]) sess[x.id]=x; out.sessions=Object.values(sess).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id);
  const bw={}; for(const x of [...o.bw,...n.bw]) bw[x.date]=x; out.bw=Object.values(bw).sort((x,y)=>x.date<y.date?-1:1);
  return out;
}
async function signIn(token){
  store.setToken(token.trim()); setSync('busy','Checking token');
  const u=await gh('/user'); sync.user=u.login;
  const id=await findGist(); const remote=id?await readGist(id):null;
  const merged=merge(S,remote); if(merged){ S=merged; store.save(S); }
  if(!id){ const g=await gh('/gists','POST',{description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(S||blank())}}}); sync.gistId=g.id; }
  else if(S) await pushNow();
  setSync('ok','Signed in as '+u.login);
}
function signOut(eraseLocal){ store.setToken(null); sync.user=null; sync.gistId=null; if(eraseLocal){ S=null; try{localStorage.removeItem(KEY);}catch(e){} mem=null; } setSync('off'); }
function schedulePush(){ if(!store.token()) return; sync.dirty=true; clearTimeout(sync.timer); sync.timer=setTimeout(pushNow,1500); }
async function pushNow(){
  if(!store.token()||!S||sync.pushing) return; sync.pushing=true; sync.dirty=false; setSync('busy','Uploading');
  try{ const id=await findGist(); if(!id) throw new Error('No gist found');
    await gh('/gists/'+id,'PATCH',{files:{[GIST_FILE]:{content:JSON.stringify(S)}}}); setSync('ok','Synced '+new Date().toLocaleTimeString());
  }catch(e){ setSync('err',e.message); }
  sync.pushing=false; if(sync.dirty) schedulePush();
}
async function pullNow(){
  if(!store.token()) return; setSync('busy','Downloading');
  try{ if(!sync.user){ const u=await gh('/user'); sync.user=u.login; }
    const id=await findGist(); if(!id){ setSync('ok','No remote data yet'); return; }
    const remote=await readGist(id); const before=JSON.stringify(S); const merged=merge(S,remote);
    if(JSON.stringify(merged)!==before){ S=merged; store.save(S); render(); }
    if(remote && JSON.stringify(merged)!==JSON.stringify(remote)) await pushNow(); else setSync('ok','Synced '+new Date().toLocaleTimeString());
  }catch(e){ setSync('err',e.message); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pullNow(); });
window.addEventListener('online',()=>{ if(sync.dirty) pushNow(); else pullNow(); });

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const KG=0.45359237;
function toKg(v){ return S.profile.units==='lb'? v*KG : v; }
function fromKg(v){ return S.profile.units==='lb'? v/KG : v; }
function fmtW(kg,d=1){ const v=fromKg(kg); return (Math.round(v/0.5)*0.5).toFixed(d).replace(/\.0$/,'')+' '+S.profile.units; }
function unit(){ return S.profile.units; }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ const d=new Date(iso+'T12:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function ex(id){ return EX.find(e=>e.id===id); }
function activeEx(day){ return EX.filter(e=>e.day===day && !(e.alt && S.profile.pull!==e.id && (e.id==='pullup'||e.id==='pulldown'))); }
function currentBw(){ return S.bw.length? S.bw[S.bw.length-1].kg : S.profile.weightKg; }
function e1rm(e,wKg,reps){ const r=Math.max(1,Math.min(12,reps)); const load = e.load==='bw'? currentBw()+wKg : wKg; return load*(1+r/30); }
function setsFor(e){ return e.sets; }

// All logged sessions for an exercise: [{date, best:e1rm, sets, allHit}]
function history(id){
  const e=ex(id); const out=[];
  for(const s of S.sessions){ const en=s.entries[id]; if(!en) continue;
    const sets=en.sets.filter(x=>x.r>0 && !x.warm);
    if(!sets.length) continue;
    const best=Math.max(...sets.map(x=>e1rmAt(e,x.w,x.r,s.bwKg)));
    const allHit = !s.calibration && sets.length>=e.sets && sets.every(x=>x.r>=e.reps);
    out.push({id:s.id,notes:s.notes,date:s.date,best,sets,allHit,calibration:s.calibration,tonnage:sets.reduce((a,x)=>a+x.w*x.r,0)});
  }
  return out;
}
function e1rmAt(e,wKg,reps,bwKg){ const r=Math.max(1,Math.min(12,reps)); const load=e.load==='bw'?(bwKg||currentBw())+wKg:wKg; return load*(1+r/30); }
function baseline(id){ const h=history(id); const c=h.find(x=>x.calibration); return c?c.best:(h[0]?h[0].best:null); }
function latest(id){ const h=history(id); return h.length?h[h.length-1]:null; }
function pr(id){ const h=history(id); if(!h.length) return null; return h.reduce((a,b)=>b.best>a.best?b:a); }

// Strength level score: 0=beginner ... 4=elite, continuous. <0 = below beginner.
function levelScore(e, value){
  const bw=currentBw(); const ratio=value/bw; const f=ageFactor(S.profile.age);
  const L=e.std.map(x=>x*f);
  if(ratio<L[0]) return ratio/L[0]-1;
  for(let i=0;i<4;i++){ if(ratio<L[i+1]) return i+(ratio-L[i])/(L[i+1]-L[i]); }
  return 4+(ratio-L[4])/L[4];
}
function levelName(sc){ if(sc<0) return 'Untrained'; return LEVELS[Math.min(4,Math.floor(sc))]; }
function exScore(id){ const l=latest(id); return l? levelScore(ex(id), l.best) : null; }
function muscleScore(m){
  const ids=EX.filter(e=>e.primary.includes(m)).map(e=>e.id);
  const sc=ids.map(exScore).filter(x=>x!==null);
  return sc.length? sc.reduce((a,b)=>a+b,0)/sc.length : null;
}
// green (0) -> yellow (1.5) -> red (3)
function heat(sc){
  if(sc===null) return '#4A515C';
  const t=Math.max(0,Math.min(1,sc/3));
  const c1=[62,187,114], c2=[230,198,75], c3=[226,74,63];
  const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
  const c = t<.5? mix(c1,c2,t*2) : mix(c2,c3,(t-.5)*2);
  const dim = sc<0? 0.55 : 1;
  return `rgb(${c.map(v=>Math.round(v*dim+ (1-dim)*58)).join(',')})`;
}
// suggested next weight (kg) and note
function suggest(e){
  const h=history(e.id); if(!h.length) return {w:null,note:'No history yet. Pick a weight you can do for the target reps.'};
  const last=h[h.length-1]; const lastW=last.sets[0].w; const inc=toKg(e.inc[unit()]);
  if(last.calibration){ // start at ~80% of calibration e1RM for 5s, ~75% for 8s
    const pct = e.reps<=5? 0.82 : 0.74;
    const target = e.load==='bw'? last.best*pct-currentBw() : last.best*pct;
    return {w:roundInc(target,inc),note:'Working weight set from your calibration.'};
  }
  if(h.length>=3){ const a=h[h.length-1].best, b=h[h.length-2].best, c=h[h.length-3].best;
    if(a<b && b<c) return {w:roundInc(lastW*0.9,inc),note:'Strength dropped two sessions in a row. Deload 10% and build back up.',deload:true}; }
  if(last.allHit) return {w:lastW+inc,note:`All sets hit ${e.reps}. Add ${fmtW(inc)}.`};
  return {w:lastW,note:'Same weight. Aim for more reps than last time.'};
}
function roundInc(w,inc){ return Math.round(w/inc)*inc; }
function nextDay(){
  const real=S.sessions.filter(s=>!s.calibration);
  if(!real.length){ const c=S.sessions.filter(s=>s.calibration); return DAYS[c.length%3]; }
  const last=real[real.length-1].day; return DAYS[(DAYS.indexOf(last)+1)%3];
}
function calibrationsDone(){ return S.sessions.filter(s=>s.calibration).length; }
function isCalibrated(){ return calibrationsDone()>=3; }

/* ============ CHART (SVG) ============ */
function lineChart(series, opts={}){
  const W=640,H=260,pl=52,pr=16,pt=18,pb=34;
  const all=series.flatMap(s=>s.pts); if(!all.length) return '<div class="faint">No data yet.</div>';
  const xs=all.map(p=>p.x), ys=all.map(p=>p.y);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1-x0<864e5*2){x0-=864e5;x1+=864e5;}
  let y0=opts.y0!==undefined?opts.y0:Math.min(...ys), y1=Math.max(...ys); if(opts.minSpan && y1-y0<opts.minSpan){ const m=(y0+y1)/2; y0=m-opts.minSpan/2; y1=m+opts.minSpan/2; } if(opts.yMinTop && y1<opts.yMinTop) y1=opts.yMinTop; const pad=(y1-y0)*0.12||1; y0-=pad; y1+=pad; if(opts.y0!==undefined) y0=opts.y0;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){ const y=y0+(y1-y0)*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#414854"/><text x="${pl-8}" y="${Y(y)+4}" text-anchor="end" font-size="12" fill="#A9B0BA">${opts.fmtY?opts.fmtY(y):y.toFixed(0)}</text>`; }
  if(opts.bands){ for(const b of opts.bands){ if(b.y<y0||b.y>y1) continue; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(b.y)}" y2="${Y(b.y)}" stroke="${b.c}" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(b.y)-4}" text-anchor="end" font-size="11" fill="${b.c}">${b.l}</text>`; } }
  for(const s of series){
    const d=s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||3}" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    if(!s.dash) for(const p of s.pts) g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.pr?'#E6C64B':s.c}"/>`;
  }
  const t0=new Date(x0),t1=new Date(x1);
  g+=`<text x="${pl}" y="${H-10}" font-size="12" fill="#A9B0BA">${t0.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text x="${W-pr}" y="${H-10}" text-anchor="end" font-size="12" fill="#A9B0BA">${t1.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`;
  if(series.length>1){ let lx=pl; for(const s of series){ g+=`<rect x="${lx}" y="2" width="14" height="4" fill="${s.c}"/><text x="${lx+18}" y="8" font-size="11" fill="#A9B0BA">${s.name}</text>`; lx+=30+s.name.length*6; } }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

      The token is stored in this browser only. Sign out on shared devices.</details>

  c.querySelectorAll('.exname').forEach(el=>el.onclick=()=>{ selEx=el.dataset.ex; renderBody(); });
  c.querySelectorAll('[data-w]').forEach(inp=>{ const id=inp.dataset.w; inp.onchange=()=>{ draft.entries[id].w=toKg(+inp.value); renderToday(); };
    const wrap=inp.parentElement; wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const e=ex(id); const inc=toKg(e.inc[unit()]); draft.entries[id].w+= b.dataset.a==='+'?inc:-inc; renderToday(); }); });
  c.querySelectorAll('[data-ww]').forEach(inp=>{ const id=inp.dataset.ww, i=+inp.dataset.s; inp.onchange=()=>{ draft.entries[id].sets[i].w=toKg(+inp.value); renderToday(); };
    inp.parentElement.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const inc=toKg(ex(id).inc[unit()]); draft.entries[id].sets[i].w+= b.dataset.a==='+'?inc:-inc; renderToday(); }); });
  c.querySelectorAll('[data-r]').forEach(inp=>{ const wrap=inp.parentElement; wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{ inp.value=Math.max(0,(+inp.value)+(b.dataset.a==='+'?1:-1)); }); });
  c.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{ const id=b.dataset.log, i=+b.dataset.s; const inp=c.querySelector(`[data-r="${id}"][data-s="${i}"]`);
    draft.entries[id].sets[i].r=Math.max(0,+inp.value); startTimer(); renderToday(); });
  c.querySelectorAll('[data-addwarm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.addwarm; const d=draft.entries[id]; const inc=toKg(ex(id).inc[unit()]); const firstWork=d.sets.findIndex(x=>!x.warm);
    d.sets.splice(firstWork<0?d.sets.length:firstWork,0,{r:null,warm:true,w:roundInc(d.w*0.6,inc)}); renderToday(); });
  c.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ draft.entries[b.dataset.rm].sets.splice(+b.dataset.s,1); renderToday(); });
  $('#notes').oninput=ev=>{ draft.notes=ev.target.value; };
  $('#discard').onclick=()=>{ if(confirm('Discard this session?')){ draft=null; stopTimer(); renderToday(); } };
  $('#finish').onclick=finishSession;
  $('#tplus').onclick=()=>{ timer.left+=30; tick(); }; $('#tskip').onclick=stopTimer;
  if(timer.id) { $('#timer').classList.add('on'); tick(); }
}
function finishSession(){
  const entries={}; let any=false, unlogged=0;
  for(const id in draft.entries){ const d=draft.entries[id]; unlogged+=d.sets.filter(s=>s.r===null&&!s.warm).length;
    const sets=d.sets.filter(s=>s.r!==null).map(s=>({w:+((s.warm?s.w:d.w)).toFixed(3), r:s.r, warm:!!s.warm})); if(sets.some(x=>!x.warm)){ any=true; entries[id]={sets}; } }
  if(!any){ toast('Log at least one working set first'); return; }
  if(unlogged && !confirm(`${unlogged} working set${unlogged>1?'s':''} not logged. Finish anyway?`)) return;
  const before={}; for(const id in entries){ const p=pr(id); before[id]=p?p.best:0; }
  S.sessions.push({id:Date.now(), date:draft.date, day:draft.day, calibration:draft.calibration, bwKg:draft.bwKg, entries, notes:(draft.notes||'').trim()});
  save();
  const prs=Object.keys(entries).filter(id=>{ const p=pr(id); return p && p.best>before[id]+0.01 && !draft.calibration; });
  draft=null; stopTimer();
  if(prs.length) toast(`Saved. ${prs.length} PR${prs.length>1?'s':''}: ${prs.map(id=>ex(id).name).join(', ')}`); else toast('Saved');
  view=isCalibrated()?'calendar':'today'; render();
}
function startTimer(){ timer.left=S.settings.rest; if(timer.id) clearInterval(timer.id); timer.id=setInterval(()=>{ timer.left--; tick(); if(timer.left<=0){ stopTimer(); beep(); toast('Rest over'); } },1000); }
function stopTimer(){ clearInterval(timer.id); timer.id=null; const t=$('#timer'); if(t) t.classList.remove('on'); }
function tick(){ const t=$('#timer'); if(!t) return; t.classList.add('on'); $('#tval').textContent=Math.floor(timer.left/60)+':'+String(timer.left%60).padStart(2,'0'); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.2; o.start(); o.stop(a.currentTime+.35); }catch(e){} }

/* ---- Edit a past session ---- */
let editId=null;
function renderEdit(){
  const c=$('#content'); const sess=S.sessions.find(x=>x.id===editId); if(!sess){ view='calendar'; render(); return; }
  let h=`<div class="row spread"><div><span class="pill">${sess.calibration?'Calibration':DAY_NAME[sess.day]+' day'}</span><h1 style="margin-top:8px">Edit session</h1></div><button class="btn ghost small" id="back">Back</button></div>
    <div class="card"><label class="f" style="margin:0"><span>Date</span><input type="text" id="edate" value="${sess.date}" style="width:160px;font-size:18px"></label></div>`;
  for(const id in sess.entries){ const e=ex(id); const en=sess.entries[id];
    h+=`<div class="card" data-ex="${id}"><div class="row spread"><h2>${e.name}</h2><button class="btn small ghost" data-addset="${id}">+ Set</button></div>
      <div class="sets"><div class="h">Set</div><div class="h">Weight (${unit()})</div><div class="h">Reps</div><div class="h"></div>`;
    let n=0; en.sets.forEach((st,i)=>{ h+=`<div class="num ${st.warm?'warm':''}">${st.warm?'W':++n}</div>
      <input type="number" step="0.5" value="${+fromKg(st.w).toFixed(1)}" data-ew="${id}" data-s="${i}">
      <input type="number" value="${st.r}" data-er="${id}" data-s="${i}">
      <div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn small ghost" data-warm="${id}" data-s="${i}">${st.warm?'Warm-up':'Working'}</button><button class="xbtn" data-del="${id}" data-s="${i}" title="Remove set">×</button></div>`; });
    h+=`</div></div>`; }
  h+=`<div class="card"><h3 style="margin-bottom:8px">Notes</h3><textarea id="enotes">${sess.notes||''}</textarea></div>
    <div class="row spread"><button class="btn small" id="delsess" style="border-color:var(--red);color:var(--red)">Delete session</button><button class="btn primary" id="esave">Save changes</button></div>`;
  c.innerHTML=h;
  const read=()=>{ for(const id in sess.entries){ const en=sess.entries[id]; en.sets.forEach((st,i)=>{ const w=c.querySelector(`[data-ew="${id}"][data-s="${i}"]`), r=c.querySelector(`[data-er="${id}"][data-s="${i}"]`); if(w) st.w=+toKg(+w.value).toFixed(3); if(r) st.r=Math.max(0,+r.value); }); } sess.notes=$('#enotes').value.trim(); sess.date=$('#edate').value; };
  $('#back').onclick=()=>{ view='calendar'; render(); };
  c.querySelectorAll('[data-warm]').forEach(b=>b.onclick=()=>{ read(); const st=sess.entries[b.dataset.warm].sets[+b.dataset.s]; st.warm=!st.warm; renderEdit(); });
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ read(); sess.entries[b.dataset.del].sets.splice(+b.dataset.s,1); if(!sess.entries[b.dataset.del].sets.length) delete sess.entries[b.dataset.del]; renderEdit(); });
  c.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{ read(); const en=sess.entries[b.dataset.addset]; const last=en.sets[en.sets.length-1]; en.sets.push({w:last?last.w:0,r:last?last.r:0,warm:false}); renderEdit(); });
  $('#esave').onclick=()=>{ read(); if(!/^\d{4}-\d{2}-\d{2}$/.test(sess.date)){ toast('Date must be YYYY-MM-DD'); return; }
    if(!Object.keys(sess.entries).length){ toast('Session has no sets left. Delete it instead.'); return; }
    S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id); save(); toast('Saved'); view='calendar'; render(); };
  $('#delsess').onclick=()=>{ if(confirm('Delete this whole session? PRs and graphs will recalculate.')){ S.sessions=S.sessions.filter(x=>x.id!==editId); save(); toast('Session deleted'); view='calendar'; render(); } };
}

/* ---- Muscle view ---- */
function renderMuscle(){
  const c=$('#content');
  if(!selMuscle){ c.innerHTML=`<h1>Body map</h1><p class="muted">Tap a muscle on the left to see how its strength has changed since calibration. Colour shows where you sit against strength standards for a ${S.profile.age}-year-old male at your bodyweight.</p>
    <div class="grid2">${Object.keys(MUSCLES).map(m=>{ const sc=muscleScore(m); return `<div class="card" style="border-left:6px solid ${heat(sc)}"><div class="row spread"><b>${MUSCLES[m]}</b><span class="faint">${sc===null?'no data':levelName(sc)}</span></div></div>`; }).join('')}</div>`; return; }
  const m=selMuscle; const ids=EX.filter(e=>e.primary.includes(m)).map(e=>e.id).filter(id=>activeEx(ex(id).day).some(e=>e.id===id));
  const sc=muscleScore(m);
  // strength index: average of e1RM/baseline across primary exercises, per date
  const byDate={};
  for(const id of ids){ const b=baseline(id); if(!b) continue; for(const h of history(id)){ (byDate[h.date]=byDate[h.date]||[]).push(h.best/b*100); } }
  const pts=Object.keys(byDate).sort().map(d=>({x:ts(d), y:byDate[d].reduce((a,b)=>a+b,0)/byDate[d].length}));
  const lastPct=pts.length? pts[pts.length-1].y : null;
  c.innerHTML=`<div class="row spread"><h1>${MUSCLES[m]}</h1><span class="pill" style="background:${heat(sc)};color:#111">${sc===null?'No data':levelName(sc)}</span></div>
    <div class="row" style="margin:12px 0 18px;gap:28px">
      <div class="stat">${lastPct?Math.round(lastPct)+'%':'—'}<small>of calibration strength</small></div>
      <div class="stat">${ids.length}<small>exercise${ids.length===1?'':'s'} target this muscle</small></div></div>
    <div class="card">${lineChart([{name:'Strength index',c:'#3F7DFF',pts}],{fmtY:v=>Math.round(v)+'%',minSpan:30,bands:[{y:100,c:'#A9B0BA',l:'baseline'}]})}</div>
    <h3 style="margin:14px 0 8px">Exercises</h3><div class="exlist">${ids.map(id=>{ const e=ex(id); const l=latest(id); const s=exScore(id);
      return `<button data-ex="${id}"><div class="row spread"><b>${e.name}</b><span class="faint">${l?fmtW(l.best)+' e1RM · '+levelName(s):'no data'}</span></div></button>`; }).join('')||'<div class="faint">Nothing in the preset targets this muscle directly.</div>'}</div>`;
  c.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ selEx=b.dataset.ex; view='progress'; render(); });
}

/* ---- Progress ---- */
function renderProgress(){
  const c=$('#content'); let all=EX.filter(e=>activeEx(e.day).includes(e));
  if(selMuscle){ const f=all.filter(e=>e.primary.includes(selMuscle)); if(f.length) all=f; }
  if(!selEx || !all.some(x=>x.id===selEx)) selEx=all[0].id; const e=ex(selEx); const h=history(e.id); const p=pr(e.id); const b=baseline(e.id); const sc=exScore(e.id);
  const bw=currentBw(); const f=ageFactor(S.profile.age);
  const bands=[{i:0,c:'#3EBB72'},{i:2,c:'#E6C64B'},{i:3,c:'#E24A3F'}].map(x=>({y:fromKg(e.std[x.i]*f*bw), c:x.c, l:LEVELS[x.i]}));
  const pts=h.map(x=>({x:ts(x.date), y:fromKg(x.best), pr:p&&x.date===p.date&&x.best===p.best}));
  const bwpts=S.bw.map(x=>({x:ts(x.date), y:fromKg(x.kg)}));
  const series=[{name:'e1RM',c:'#3F7DFF',pts}]; if(bwpts.length>1||h.length) series.push({name:'Bodyweight',c:'#6F7784',pts:bwpts,dash:true,w:2});
  const vol=h.map(x=>({x:ts(x.date), y:fromKg(x.tonnage)}));
  c.innerHTML=`<div class="row" style="gap:8px;margin-bottom:14px"><select id="expick" style="width:auto;font-size:18px;text-align:left">${all.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${DAY_NAME[x.day]} · ${x.name}</option>`).join('')}</select>${selMuscle?`<button class="btn small" id="clearm">${MUSCLES[selMuscle]} ×</button>`:'<span class="faint" style="font-size:13px">Tap a muscle to filter</span>'}</div>
    <h1>${e.name}</h1>
    <div class="row" style="margin:12px 0 18px;gap:28px">
      <div class="stat">${p?fmtW(p.best):'—'}<small>best e1RM${p?' · '+fmtDate(p.date):''}</small></div>
      <div class="stat">${b&&p?Math.round((p.best/b-1)*100)+'%':'—'}<small>since calibration</small></div>
      <div class="stat">${sc===null?'—':levelName(sc)}<small>${sc===null?'strength level':'at '+Math.round(fromKg(bw))+' '+unit()+' bodyweight'}</small></div></div>
    <div class="card">${lineChart(series,{fmtY:v=>Math.round(v),bands, y0:0, yMinTop:bands[1].y*1.05})}<div class="faint" style="font-size:13px;margin-top:6px">Dashed lines are strength-standard thresholds for your bodyweight and age. Gold dots are PRs. e1RM uses Epley: weight × (1 + reps/30), reps capped at 12.${e.load==='bw'?' Bodyweight is included in the load.':''}${e.load==='db'?' Weight is per dumbbell.':''}</div></div>
    <h3 style="margin:14px 0 8px">Session volume (weight × reps)</h3><div class="card">${lineChart([{name:'Tonnage',c:'#8FB3FF',pts:vol}],{fmtY:v=>Math.round(v)})}</div>
    <h3 style="margin:14px 0 8px">Log</h3>${h.slice().reverse().map(x=>`<div class="card" style="padding:10px 16px"><div class="row spread"><b>${fmtDate(x.date)}${x.calibration?' <span class="pill">calibration</span>':''}</b><span class="num">${fmtW(x.best)}</span></div><div class="row spread"><div class="muted" style="font-size:14px">${x.sets.map(s=>fmtW(s.w)+' × '+s.r).join(' · ')}${x.notes?'<div class="faint" style="font-size:13px">'+x.notes+'</div>':''}</div><button class="btn small ghost" data-edit="${x.id}">Edit</button></div></div>`).join('')||'<div class="faint">No sessions logged yet.</div>'}`;
  $('#expick').onchange=ev=>{ selEx=ev.target.value; render(); };
  if($('#clearm')) $('#clearm').onclick=()=>{ selMuscle=null; render(); };
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ editId=+b.dataset.edit; view='edit'; render(); });
  renderBody();
}

/* ---- Calendar ---- */
function renderCalendar(){
  const c=$('#content'); const nd=nextDay(); const calib=!isCalibrated();
  const byDate={}; for(const s of S.sessions) byDate[s.date]=s.calibration?'cal':s.day;
  const start=new Date(); start.setDate(start.getDate()-start.getDay()-7*7); // 8 weeks incl. this one
  let cells=''; for(let i=0;i<56;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const iso=d.toISOString().slice(0,10); const k=byDate[iso];
    cells+=`<div class="d ${k||''} ${iso===today()?'today':''}" data-day="${iso}"><small>${d.getDate()}</small>${k?(k==='cal'?'C':DAY_NAME[k][0]):''}</div>`; }
  const recent=S.sessions.slice(-8).reverse();
  const week=S.sessions.filter(s=>{ const t=ts(s.date); return Date.now()-t<7*864e5; }).length;
  const total=S.sessions.filter(s=>!s.calibration).length;
  const prsRecent=[]; for(const e of EX){ const p=pr(e.id); if(p && Date.now()-ts(p.date)<14*864e5 && !p.calibration) prsRecent.push({e,p}); }
  c.innerHTML=`<div class="row spread"><h1>Calendar</h1><span class="pill blue">Next: ${calib?'calibration '+(calibrationsDone()+1)+' · ':''}${DAY_NAME[nd]}</span></div>
    <div class="row" style="margin:12px 0 18px;gap:28px"><div class="stat">${week}<small>sessions in the last 7 days (target 3)</small></div><div class="stat">${total}<small>workouts since calibration</small></div></div>
    <div class="card"><div class="cal" style="margin-bottom:6px">${['S','M','T','W','T','F','S'].map(x=>`<div class="faint" style="text-align:center;font-size:12px">${x}</div>`).join('')}</div><div class="cal">${cells}</div>
    <div class="row" style="margin-top:10px;font-size:13px;gap:14px"><span class="pill" style="background:#3d5f8f;color:#fff">Push</span><span class="pill" style="background:#3f7a63;color:#fff">Pull</span><span class="pill" style="background:#8a5637;color:#fff">Legs</span><span class="pill" style="background:#6b5aa8;color:#fff">Calibration</span></div></div>
    <h3 style="margin:14px 0 8px">PRs in the last two weeks</h3>${prsRecent.length?prsRecent.map(x=>`<div class="card" style="padding:10px 16px"><div class="row spread"><b>${x.e.name}</b><span class="badge">PR · ${fmtW(x.p.best)} e1RM</span></div><div class="faint" style="font-size:13px">${fmtDate(x.p.date)}</div></div>`).join(''):'<div class="faint">None yet. They show up here after you beat an estimated 1RM.</div>'}
    <h3 style="margin:14px 0 8px">Recent sessions</h3>${recent.map(x=>`<div class="card" style="padding:10px 16px"><div class="row spread"><div><b>${fmtDate(x.date)}</b> <span class="faint">${x.calibration?'calibration':DAY_NAME[x.day]} · ${Object.keys(x.entries).length} exercises</span>${x.notes?'<div class="muted" style="font-size:14px">'+x.notes+'</div>':''}</div><button class="btn small ghost" data-edit="${x.id}">Edit</button></div></div>`).join('')||'<div class="faint">Nothing yet.</div>'}
    <div style="margin-top:20px"><button class="btn primary" id="gotoday">Open ${calib?'calibration':DAY_NAME[nd]+' day'}</button></div>`;
  $('#gotoday').onclick=()=>{ view='today'; render(); };
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ editId=+b.dataset.edit; view='edit'; render(); });
  c.querySelectorAll('.cal .d[data-day]').forEach(el=>el.onclick=()=>{ const ss=S.sessions.filter(x=>x.date===el.dataset.day); if(!ss.length) return; editId=ss[ss.length-1].id; view='edit'; render(); });
}

/* ---- Settings ---- */
function renderSettings(){
  const c=$('#content'); const p=S.profile;
  const acct = store.token()
    ? `<div class="card"><h3 style="margin-bottom:8px">Account</h3><div class="row spread"><div>Signed in as <b>${sync.user||'…'}</b><div class="faint" style="font-size:13px">${{ok:'Synced',busy:'Syncing…',err:'Sync error: '+sync.msg,off:''}[sync.state]||''}</div></div><div class="row"><button class="btn small" id="syncnow">Sync now</button><button class="btn small" id="signout">Sign out</button></div></div></div>`
    : `<div class="card"><h3 style="margin-bottom:8px">Account</h3><div class="row"><input type="password" id="tok2" placeholder="GitHub token with Gists permission" style="width:100%;max-width:360px;text-align:left;font-family:var(--body);font-size:16px"><button class="btn small" id="signin2">Sign in to sync</button></div><div class="faint" style="font-size:13px;margin-top:6px">Data on this device will be merged with whatever is already in your gist.</div></div>`;
  c.innerHTML=`<h1>Settings</h1>${acct}
    <div class="card"><h3 style="margin-bottom:8px">Profile (locked at setup)</h3><div class="row" style="gap:24px"><div class="stat">${p.age}<small>age</small></div><div class="stat">${p.heightCm}<small>cm</small></div><div class="stat">${Math.round(fromKg(p.weightKg))}<small>${p.units} at setup</small></div><div class="stat">${ex(p.pull).name}<small>pull main lift</small></div></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Bodyweight log</h3><div class="row"><input type="number" id="bwin" step="0.1" value="${+fromKg(currentBw()).toFixed(1)}"><span class="muted">${p.units}</span><button class="btn small" id="bwadd">Log today</button></div>
      <div class="muted" style="font-size:14px;margin-top:8px">${S.bw.slice(-6).reverse().map(x=>fmtDate(x.date)+': '+fmtW(x.kg)).join(' · ')}</div><div class="faint" style="font-size:13px;margin-top:6px">Strength standards and bodyweight exercises use the latest entry.</div></div>
    <div class="card"><h3 style="margin-bottom:8px">Rest timer</h3><div class="row"><input type="number" id="rest" value="${S.settings.rest}"><span class="muted">seconds</span><button class="btn small" id="restsave">Save</button></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Backup</h3><div class="row"><button class="btn small" id="exp">Export JSON</button><button class="btn small" id="imp">Import JSON</button><input type="file" id="impf" accept=".json" class="hidden"></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Reset</h3><button class="btn small" id="reset" style="border-color:var(--red);color:var(--red)">Erase everything</button></div>
    <p class="faint" style="font-size:13px">Preset split: Muscle &amp; Strength 3-day beginner PPL. Standards: bodyweight-ratio tables (male, 18-39), scaled ${Math.round(ageFactor(p.age)*100)}% for age. e1RM by Epley formula.</p>`;
  if($('#syncnow')) $('#syncnow').onclick=()=>pullNow().then(()=>{ toast(sync.state==='ok'?'Synced':'Sync failed: '+sync.msg); render(); });
  if($('#signout')) $('#signout').onclick=()=>{ const erase=confirm('Also erase the data stored on this device? (It stays in your gist.)\n\nOK = erase local copy · Cancel = keep it'); signOut(erase); render(); };
  if($('#signin2')) $('#signin2').onclick=async()=>{ const t=$('#tok2').value.trim(); if(!t) return; try{ await signIn(t); toast('Signed in as '+sync.user); }catch(e){ store.setToken(null); toast(e.message); } render(); };
  $('#bwadd').onclick=()=>{ const kg=toKg(+$('#bwin').value); if(!kg) return; const i=S.bw.findIndex(x=>x.date===today()); if(i>=0) S.bw[i].kg=kg; else S.bw.push({date:today(),kg}); save(); toast('Bodyweight logged'); render(); };
  $('#restsave').onclick=()=>{ S.settings.rest=Math.max(15,+$('#rest').value||120); save(); toast('Saved'); };
  $('#exp').onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ppl-ledger-'+today()+'.json'; a.click(); };
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.profile||!d.sessions) throw 0; S=d; save(); toast('Imported'); render(); }catch(e){ toast('That file is not a ledger backup'); } }; r.readAsText(f); };
  $('#reset').onclick=()=>{ if(confirm('Erase all sessions, calibration and profile on this device AND in your gist? Export first if you want a backup.')){ S=blank(); save(); S=null; try{localStorage.removeItem(KEY);}catch(e){} mem=null; render(); } };
}

render();
if(store.token()) pullNow();
</script>
</body>
</html>
